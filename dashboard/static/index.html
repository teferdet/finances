<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Finances Bot — Admin Dashboard" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />

  <title>Finances Dashboard</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Material You design system -->
  <link rel="stylesheet" href="/css/material.css" />

  <!-- Shake animation for wrong OTP -->
  <style>
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
  </style>

  <!-- Favicon inline SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
</head>
<body>
  <!-- Mount point for SPA -->
  <div id="app" aria-live="polite">
    <!-- Login screen rendered here by app.js -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
                color:var(--md-on-surface-variant);font-family:'Roboto Flex',sans-serif">
      Initializing…
    </div>
  </div>

  <!-- Chart.js — loaded from CDN for chart rendering -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
          integrity="sha256-oVuCGcvrTKJGSFE38d5NZcVhUhXqzb/xL8mxSBVmJEY=" crossorigin="anonymous"
          defer></script>

  <!-- SPA application -->
  <script src="/js/app.js" defer></script>
</body>
</html>
