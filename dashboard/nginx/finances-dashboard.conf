# ── Rate limiting zones ───────────────────────────────────────────────────────
# Must be inside http{} block if not already defined globally.
# If your main nginx.conf already has a rate-limit zone, remove these.
limit_req_zone $binary_remote_addr zone=dash_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dash_api:10m rate=60r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── HTTPS (self-signed cert) ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # ── TLS certificate (self-signed, generated with openssl) ────────────────
    ssl_certificate     /etc/ssl/finances/selfsigned.crt;
    ssl_certificate_key /etc/ssl/finances/selfsigned.key;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_session_tickets       off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Static files (React SPA) ──────────────────────────────────────────────
    root /home/ubuntu/finances/dashboard/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Auth API — strict rate limit ──────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=dash_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── API — general limit ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=dash_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~ /\. { deny all; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location = /favicon.ico { log_not_found off; access_log off; }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/dashboard_access.log;
    error_log  /var/log/nginx/dashboard_error.log warn;

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        internal;
        return 429 '{"detail":"Rate limit exceeded. Try again later."}';
        add_header Content-Type application/json always;
    }

    error_page 502 503 504 /5xx.json;
    location = /5xx.json {
        internal;
        return 502 '{"detail":"API server unavailable. Check bot service."}';
        add_header Content-Type application/json always;
    }
}
