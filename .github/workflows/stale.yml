name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because there has been
            no activity for 30 days. It will be closed in 14 days unless updated.
            If this is still relevant, please leave a comment.
          close-issue-message: >
            This issue has been closed due to inactivity. Feel free to reopen it
            if the problem persists.

          # Pull Requests
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has been automatically marked as stale due to 60 days
            of inactivity. It will be closed in 14 days. Please rebase and update
            if you'd like to continue with this PR.
          close-pr-message: >
            This PR has been closed due to inactivity. Feel free to reopen it.

          # Exemptions
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security,in-progress'
          exempt-all-milestones: true
