name: Server Health Check

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check bot service health
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR" || exit 1

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  📊 Finances Bot Health Check"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Service status
            if docker compose ps bot | grep -q "Up"; then
              echo "✅ Service: RUNNING"
            else
              echo "❌ Service: DOWN"
              echo ""
              echo "📋 Recent logs:"
              docker compose logs --tail=30 bot
              exit 1
            fi

            # Resource usage
            CONTAINER_ID=$(docker compose ps -q bot)
            if [ -n "$CONTAINER_ID" ]; then
              STATS=$(docker stats --no-stream --format "💾 Memory: {{.MemUsage}} | ⚡ CPU: {{.CPUPerc}}" "$CONTAINER_ID")
              echo "$STATS"
            else
              echo "⚠️ Could not fetch container stats."
            fi

            # Disk usage
            DISK_USAGE=$(df -h "$APP_DIR" --output=pcent | tail -1 | tr -d ' ')
            echo "💿 Disk: $DISK_USAGE used"

            echo ""
            echo "✅ Health check passed"
