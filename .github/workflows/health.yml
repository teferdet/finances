name: Server Health Check

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check bot service health
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  📊 Finances Bot Health Check"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Service status
            if sudo systemctl is-active --quiet finances-bot.service; then
              echo "✅ Service: RUNNING"
              echo "📅 Started: $(systemctl show finances-bot -p ActiveEnterTimestamp --value)"
            else
              echo "❌ Service: DOWN"
              echo ""
              echo "📋 Recent logs:"
              sudo journalctl -u finances-bot -n 30 --no-pager
              exit 1
            fi

            # Resource usage
            BOT_PID=$(pgrep -f 'python -m app' 2>/dev/null || echo "")
            if [ -n "$BOT_PID" ]; then
              MEM=$(ps -o rss= -p "$BOT_PID" | awk '{printf "%.1f MB", $1/1024}')
              CPU=$(ps -o %cpu= -p "$BOT_PID" | awk '{printf "%.1f%%", $1}')
              echo "💾 Memory: $MEM"
              echo "⚡ CPU: $CPU"
            fi

            # Disk usage
            DISK_USAGE=$(df -h /home/ubuntu/finances --output=pcent | tail -1 | tr -d ' ')
            echo "💿 Disk: $DISK_USAGE used"

            echo ""
            echo "✅ Health check passed"

