name: Deploy Dashboard to Oracle VPS

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 0. Build React Frontend (Fast CI Runner) ──────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package.json

      - name: ⚛️ Build React Frontend
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm run build

      # ── 0.1 Build .NET API (Fast CI Runner) ───────────────────────────
      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Publish .NET API
        run: |
          dotnet publish dashboard/API/API.csproj -c Release -o dashboard/API/publish

      # ── 1. Pull Latest Code on VPS ────────────────────────────────────
      - name: 📦 Pull Latest Code
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 First deploy — cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            else
              echo "🔄 Pulling latest changes..."
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              find .git -name "*.lock" -delete 2>/dev/null || true
              if ! git fetch --force origin main; then
                echo "⚠️  Fetch failed even after clearing locks — re-cloning fresh."
                cd ..
                sudo rm -rf "$APP_DIR"
                git clone "$REPO_URL" "$APP_DIR"
                cd "$APP_DIR"
              fi
              git reset --hard origin/main
            fi

            cd "$APP_DIR"
            echo "✅ Code is at commit: $(git rev-parse --short HEAD)"
            echo "📝 Latest: $(git log -1 --pretty=format:'%s')"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # ── 1.1 Transfer Pre-built Artifacts to VPS ───────────────────────
      - name: 🚀 Transfer Built Frontend Dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dashboard/frontend/dist"
          target: "/home/ubuntu/finances/dashboard/frontend"
          strip_components: 2

      - name: 🚀 Transfer Built API Publish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dashboard/API/publish"
          target: "/home/ubuntu/finances/dashboard/API"
          strip_components: 2

      # ── 2. Generate Unified .env ──────────────────────────────────────
      - name: 🔐 Generate Unified Environment
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: BOT_TOKEN,MONGO_URI,BOT_ADMIN_IDS,DASHBOARD_SECRET_KEY,REDIS_URL
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"

            # Remove legacy dashboard/.env files
            rm -f "$APP_DIR/dashboard/.env" "$APP_DIR/dashboard/API/.env"

            cat > "$APP_DIR/.env" << EOF
            BOT_TOKEN=${BOT_TOKEN}
            MONGO_URI=${MONGO_URI}
            MONGO_DATABASE=finances
            BOT_ADMIN_IDS=${BOT_ADMIN_IDS}
            JWT_SECRET=${JWT_SECRET:-${DASHBOARD_SECRET_KEY}}
            REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
            EOF

            chmod 600 "$APP_DIR/.env"
            echo "✅ Unified .env generated"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BOT_ADMIN_IDS: ${{ secrets.BOT_ADMIN_IDS }}
          DASHBOARD_SECRET_KEY: ${{ secrets.DASHBOARD_SECRET_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      # ── 3. Deploy Dashboard & Frontend with Docker Compose ────────────
      - name: 🚀 Deploy Dashboard Services
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR"
            
            echo "📁 Ensuring log directories and permissions..."
            mkdir -p "$APP_DIR/logs/bot" "$APP_DIR/logs/api" "$APP_DIR/config"
            chmod -R 777 "$APP_DIR/logs"

            echo "🐳 Starting Docker Compose for dashboard and frontend..."
            docker compose up -d --build dashboard frontend
            
            # Prune old images
            docker image prune -f
            
            echo "✅ Dashboard and Frontend services deployed"

      # ── 4. Health Check ───────────────────────────────────────────────
      - name: ✅ Health Check
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR"

            STARTED=false
            for i in $(seq 1 10); do
              if docker compose ps dashboard | grep -q "Up" && docker compose ps frontend | grep -q "Up"; then
                echo "✅ Dashboard and Frontend containers are running! (attempt $i/10)"
                STARTED=true
                break
              fi
              echo "⏳ Waiting for containers... ($i/10)"
              sleep 2
            done

            if [ "$STARTED" = false ]; then
              echo "❌ Containers failed to start. Logs:"
              docker compose logs dashboard frontend
              exit 1
            fi

            # API health check via frontend proxy on port 80
            API_UP=false
            for i in $(seq 1 10); do
              HEALTH=$(curl -sf http://127.0.0.1/api/health || echo "FAIL")
              if echo "$HEALTH" | grep -q '"ok"'; then
                echo "✅ API health check passed: $HEALTH"
                API_UP=true
                break
              fi
              echo "⏳ Waiting for API response... ($i/10)"
              sleep 3
            done

            if [ "$API_UP" = false ]; then
              echo "❌ API health check failed: $HEALTH"
              docker compose logs dashboard
              exit 1
            fi

            echo "🎉 Dashboard deploy completed successfully!"
