name: Pyre Type Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  pyre:
    name: Pyre / Pysa Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    # Pyre may produce false positives on dynamically-typed code,
    # so we don't block merges on failures

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pyre
        run: pip install pyre-check

      - name: Run Pyre (Type Check + Taint Analysis)
        run: |
          # Run Pyre type checking and output SARIF
          pyre --noninteractive check --output json > /dev/null 2>&1 || true
          # Run Pysa taint analysis for data flow tracking:
          # user-controlled sources (Telegram messages) → dangerous
          # sinks (database queries, API calls, file operations)
          pyre --noninteractive analyze --save-results-to=./pysa-results --no-verify || true

      - name: Convert results to SARIF
        if: always()
        run: |
          # Create minimal SARIF even if Pyre/Pysa produced no results
          python -c "
          import json, os, glob

          sarif = {
            '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json',
            'version': '2.1.0',
            'runs': [{
              'tool': {'driver': {'name': 'Pyre/Pysa', 'version': '1.0', 'rules': []}},
              'results': []
            }]
          }

          # Try to parse Pysa taint results if available
          results_dir = './pysa-results'
          if os.path.isdir(results_dir):
            for f in glob.glob(os.path.join(results_dir, '*.json')):
              try:
                with open(f) as fh:
                  data = json.load(fh)
                  if isinstance(data, list):
                    for issue in data:
                      if isinstance(issue, dict) and 'path' in issue:
                        sarif['runs'][0]['results'].append({
                          'ruleId': issue.get('code', 'pysa-finding'),
                          'level': 'warning',
                          'message': {'text': issue.get('description', 'Taint analysis finding')},
                          'locations': [{
                            'physicalLocation': {
                              'artifactLocation': {'uri': issue.get('path', '')},
                              'region': {'startLine': issue.get('line', 1)}
                            }
                          }]
                        })
              except (json.JSONDecodeError, KeyError):
                pass

          with open('pyre-results.sarif', 'w') as f:
            json.dump(sarif, f, indent=2)
          print(f'SARIF generated with {len(sarif[\"runs\"][0][\"results\"])} results')
          "

      - name: Upload SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pyre-results.sarif

