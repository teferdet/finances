name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dashboard/**'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 1. Pull Latest Code ──────────────────────────────────────────
      - name: 📦 Pull Latest Code
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 First deploy — cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            else
              echo "🔄 Pulling latest changes..."
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              find .git -name "*.lock" -delete 2>/dev/null || true
              if ! git fetch --force origin main; then
                echo "⚠️  Fetch failed even after clearing locks — re-cloning fresh."
                cd ..
                sudo rm -rf "$APP_DIR"
                git clone "$REPO_URL" "$APP_DIR"
                cd "$APP_DIR"
              fi
              git reset --hard origin/main
            fi

            cd "$APP_DIR"
            echo "✅ Code is at commit: $(git rev-parse --short HEAD)"
            echo "📝 Latest: $(git log -1 --pretty=format:'%s')"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # ── 2. Generate Configuration ────────────────────────────────────
      - name: 🔐 Generate settings.json
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: BOT_TOKEN,MONGO_URI,CRYPTO_API_KEY,STOCKS_API_KEY,FERNET_KEY,BOT_ADMIN_IDS,DASHBOARD_SECRET_KEY,URL_COMMUNICATION,URL_INVITE,URL_BUYMEACOFFEE,URL_DONATELLO,URL_BANK,URL_MINI_APP,REDIS_URL
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"

            echo "🔐 Generating unified .env and settings.json from secrets..."
            
            # Clean up any legacy dashboard/.env file
            rm -f "$APP_DIR/dashboard/.env" "$APP_DIR/dashboard/API/.env"

            cat > "$APP_DIR/.env" << EOF
            BOT_TOKEN=${BOT_TOKEN}
            BOT_ADMIN_IDS=${BOT_ADMIN_IDS}
            BACKUP_ENABLED=true
            MONGO_URI=${MONGO_URI}
            MONGO_DATABASE=finances
            DB_POOL_MIN=5
            DB_POOL_MAX=50
            JWT_SECRET=${JWT_SECRET:-${DASHBOARD_SECRET_KEY}}
            CRYPTO_API_KEY=${CRYPTO_API_KEY}
            STOCKS_API_KEY=${STOCKS_API_KEY}
            FERNET_KEY=${FERNET_KEY}
            RATE_LIMIT_REQUESTS=30
            RATE_LIMIT_WINDOW_SEC=60
            REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
            MINI_APP_ENABLED=false
            GROUPS_ENABLED=true
            INLINE_MODE_ENABLED=true
            URL_COMMUNICATION=${URL_COMMUNICATION}
            URL_INVITE=${URL_INVITE}
            URL_BUYMEACOFFEE=${URL_BUYMEACOFFEE}
            URL_DONATELLO=${URL_DONATELLO}
            URL_BANK=${URL_BANK}
            URL_MINI_APP=${URL_MINI_APP}
            EOF

            chmod 600 "$APP_DIR/.env"

            python3 -c "
            import json, os

            def env_list(key, default='[]'):
                try:
                    return json.loads(os.environ.get(key, default))
                except:
                    return json.loads(default)

            settings = {
                'bot': {
                    'token': os.environ.get('BOT_TOKEN', ''),
                    'admin_ids': env_list('BOT_ADMIN_IDS', '[]'),
                    'backup_enabled': True,
                    'version': 'finances 6.6.0'
                },
                'database': {
                    'mongo_uri': os.environ.get('MONGO_URI', ''),
                    'mongo_database': 'finances',
                    'pool_min': 5,
                    'pool_max': 50
                },
                'api_keys': {
                    'crypto': os.environ.get('CRYPTO_API_KEY', ''),
                    'stocks': os.environ.get('STOCKS_API_KEY', '')
                },
                'urls': {
                    'github': '',
                    'communication': os.environ.get('URL_COMMUNICATION', ''),
                    'invite': os.environ.get('URL_INVITE', ''),
                    'buymeacoffee': os.environ.get('URL_BUYMEACOFFEE', ''),
                    'donatello': os.environ.get('URL_DONATELLO', ''),
                    'bank': os.environ.get('URL_BANK', ''),
                    'mini_app': os.environ.get('URL_MINI_APP', '')
                },
                'i18n': {
                    'supported_languages': ['en', 'uk'],
                    'default_language': 'en'
                },
                'security': {
                    'rate_limit_requests': 30,
                    'rate_limit_window_sec': 60,
                    'fernet_key': os.environ.get('FERNET_KEY', '')
                },
                'features': {
                    'mini_app_enabled': False,
                    'groups_enabled': True,
                    'inline_mode_enabled': True
                },
                'redis': {
                    'url': os.environ.get('REDIS_URL', 'redis://redis:6379/0')
                },
                'draft': {
                    'enabled': True,
                    'loading_threshold_sec': 0.05,
                    'animation_interval_sec': 0.25,
                    'preview_delay_sec': 0.15
                }
            }
            
            os.makedirs('/home/ubuntu/finances/config', exist_ok=True)
            with open('/home/ubuntu/finances/config/settings.json', 'w', encoding='utf-8') as f:
                json.dump(settings, f, indent=2, ensure_ascii=False)
            print('✅ settings.json generated successfully')
            "
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CRYPTO_API_KEY: ${{ secrets.CRYPTO_API_KEY }}
          STOCKS_API_KEY: ${{ secrets.STOCKS_API_KEY }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          BOT_ADMIN_IDS: ${{ secrets.BOT_ADMIN_IDS }}
          DASHBOARD_SECRET_KEY: ${{ secrets.DASHBOARD_SECRET_KEY }}
          URL_COMMUNICATION: ${{ vars.URL_COMMUNICATION }}
          URL_INVITE: ${{ vars.URL_INVITE }}
          URL_BUYMEACOFFEE: ${{ vars.URL_BUYMEACOFFEE }}
          URL_DONATELLO: ${{ vars.URL_DONATELLO }}
          URL_BANK: ${{ vars.URL_BANK }}
          URL_MINI_APP: ${{ vars.URL_MINI_APP }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      # ── 3. Deploy with Docker Compose ────────────────────────────────
      - name: 🚀 Deploy Services
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR"
            
            echo "📁 Ensuring log directories and permissions..."
            mkdir -p "$APP_DIR/logs/bot" "$APP_DIR/logs/api" "$APP_DIR/config"
            chmod -R 777 "$APP_DIR/logs"

            echo "🐳 Starting Docker Compose for bot & redis..."
            docker compose up -d --build bot redis
            
            # Prune old images to save space
            docker image prune -f
            
            echo "✅ Bot service deployed"

      # ── 4. Health Check ──────────────────────────────────────────────
      - name: ✅ Health Check
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR"

            STARTED=false
            for i in $(seq 1 10); do
              if docker compose ps bot | grep -q "Up"; then
                echo "✅ finances-bot container is running! (attempt $i/10)"
                STARTED=true
                break
              fi
              echo "⏳ Waiting for container to start... ($i/10)"
              sleep 2
            done

            if [ "$STARTED" = false ]; then
              echo "❌ finances-bot failed to start. Logs:"
              docker compose logs bot
              exit 1
            fi
            
            echo "🎉 Bot deploy completed successfully!"


