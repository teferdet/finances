name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dashboard/**'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ── 1. Pull Latest Code ──────────────────────────────────────────
      - name: 📦 Pull Latest Code
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 First deploy — cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            else
              echo "🔄 Pulling latest changes..."
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              find .git -name "*.lock" -delete 2>/dev/null || true
              if ! git fetch --force origin main; then
                echo "⚠️  Fetch failed even after clearing locks — re-cloning fresh."
                cd ..
                sudo rm -rf "$APP_DIR"
                git clone "$REPO_URL" "$APP_DIR"
                cd "$APP_DIR"
              fi
              git reset --hard origin/main
            fi

            cd "$APP_DIR"
            echo "✅ Code is at commit: $(git rev-parse --short HEAD)"
            echo "📝 Latest: $(git log -1 --pretty=format:'%s')"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # ── 2. Generate Configuration ────────────────────────────────────
      - name: 🔐 Generate .env
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: BOT_TOKEN,MONGO_URI,CRYPTO_API_KEY,STOCKS_API_KEY,FERNET_KEY,BOT_ADMIN_IDS,URL_COMMUNICATION,URL_INVITE,URL_BUYMEACOFFEE,URL_DONATELLO,URL_BANK,URL_MINI_APP,REDIS_URL,SENTRY_DSN
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"

            echo "🔐 Generating .env from secrets..."
            cat > "$APP_DIR/.env" << EOF
            BOT_TOKEN=${BOT_TOKEN}
            MONGO_URI=${MONGO_URI}
            CRYPTO_API_KEY=${CRYPTO_API_KEY}
            STOCKS_API_KEY=${STOCKS_API_KEY}
            FERNET_KEY=${FERNET_KEY}
            BOT_ADMIN_IDS=${BOT_ADMIN_IDS}
            URL_COMMUNICATION=${URL_COMMUNICATION}
            URL_INVITE=${URL_INVITE}
            URL_BUYMEACOFFEE=${URL_BUYMEACOFFEE}
            URL_DONATELLO=${URL_DONATELLO}
            URL_BANK=${URL_BANK}
            URL_MINI_APP=${URL_MINI_APP}
            REDIS_URL=${REDIS_URL}
            SENTRY_DSN=${SENTRY_DSN}
            EOF
            chmod 600 "$APP_DIR/.env"
            echo "✅ .env generated successfully"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CRYPTO_API_KEY: ${{ secrets.CRYPTO_API_KEY }}
          STOCKS_API_KEY: ${{ secrets.STOCKS_API_KEY }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          BOT_ADMIN_IDS: ${{ secrets.BOT_ADMIN_IDS }}
          URL_COMMUNICATION: ${{ vars.URL_COMMUNICATION }}
          URL_INVITE: ${{ vars.URL_INVITE }}
          URL_BUYMEACOFFEE: ${{ vars.URL_BUYMEACOFFEE }}
          URL_DONATELLO: ${{ vars.URL_DONATELLO }}
          URL_BANK: ${{ vars.URL_BANK }}
          URL_MINI_APP: ${{ vars.URL_MINI_APP }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # ── 3. Deploy with Docker Compose ────────────────────────────────
      - name: 🚀 Deploy Services
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR"
            
            echo "🐳 Starting Docker Compose for bot..."
            docker compose up -d --build bot
            
            # Prune old images to save space
            docker image prune -f
            
            echo "✅ Bot service deployed"

      # ── 4. Health Check ──────────────────────────────────────────────
      - name: ✅ Health Check
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            set -e
            APP_DIR="/home/ubuntu/finances"
            cd "$APP_DIR"

            STARTED=false
            for i in $(seq 1 10); do
              if docker compose ps bot | grep -q "Up"; then
                echo "✅ finances-bot container is running! (attempt $i/10)"
                STARTED=true
                break
              fi
              echo "⏳ Waiting for container to start... ($i/10)"
              sleep 2
            done

            if [ "$STARTED" = false ]; then
              echo "❌ finances-bot failed to start. Logs:"
              docker compose logs bot
              exit 1
            fi
            
            echo "🎉 Bot deploy completed successfully!"

