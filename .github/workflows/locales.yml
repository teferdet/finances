name: Validate Locales

on:
  push:
    paths: ['locales/**']
  pull_request:
    paths: ['locales/**']

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON syntax
        run: |
          echo "🔍 Checking JSON syntax..."
          ERRORS=0
          for f in locales/*.json; do
            if python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "✅ $f — valid JSON"
            else
              echo "❌ $f — invalid JSON!"
              ERRORS=1
            fi
          done
          if [ "$ERRORS" -eq 1 ]; then
            exit 1
          fi

      - name: Check locale key completeness
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path

          locales_dir = Path('locales')
          files = sorted(locales_dir.glob('*.json'))

          def get_keys(d, prefix=''):
              keys = set()
              for k, v in d.items():
                  full_key = f'{prefix}.{k}' if prefix else k
                  if isinstance(v, dict):
                      keys.update(get_keys(v, full_key))
                  else:
                      keys.add(full_key)
              return keys

          # Use 'en' as reference
          ref_file = locales_dir / 'en.json'
          ref_keys = get_keys(json.loads(ref_file.read_text(encoding='utf-8')))
          print(f'📋 Reference (en): {len(ref_keys)} keys')
          print()

          errors = False
          for f in files:
              if f.name == 'en.json':
                  continue
              locale_keys = get_keys(json.loads(f.read_text(encoding='utf-8')))
              missing = ref_keys - locale_keys
              extra = locale_keys - ref_keys
              if missing:
                  print(f'❌ {f.name}: missing {len(missing)} keys')
                  for k in sorted(missing)[:15]:
                      print(f'   - {k}')
                  if len(missing) > 15:
                      print(f'   ... and {len(missing) - 15} more')
                  errors = True
              else:
                  print(f'✅ {f.name}: all {len(locale_keys)} keys present')
              if extra:
                  print(f'   ⚠️  {f.name}: {len(extra)} extra keys (not in en.json)')
          print()
          if errors:
              print('❌ Some locales have missing keys!')
              sys.exit(1)
          else:
              print('✅ All locales are complete!')
          "
