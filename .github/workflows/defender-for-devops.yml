name: Defender for DevOps

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Microsoft Security DevOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1
        id: msdo
        continue-on-error: true  # Don't fail the job if the scan itself errors
        with:
          # Bandit: Python-specific SAST (hardcoded passwords, eval, pickle, etc.)
          # Note: Credscan removed — requires .NET 6.0 (EOL), and GitHub's
          # built-in Secret Scanning covers this better for public repos.
          # TemplateAnalyzer removed — no IaC files in this project.
          tools: bandit

      - name: Upload SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Only upload when MSDO produced a SARIF file (skips gracefully on scan error)
        if: always() && steps.msdo.outputs.sarifFile != ''
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}

