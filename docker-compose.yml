# docker-compose.yml — Finances project local/Docker deployment
#
# Services:
#   bot        — Telegram bot (Python/aiogram)
#   redis      — Optional cache (disabled by default — set REDIS_URL to enable)
#
# Quick start:
#   cp .env.example .env   # fill in required secrets
#   docker compose up -d --remove-orphans
#
# Healthchecks: all services have healthchecks defined.
# Logs: docker compose logs -f bot

name: finances

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  app_logs:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  finances_net:
    driver: bridge

# ── Services ───────────────────────────────────────────────────────────────────
services:

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # Optional cache. Only used when REDIS_URL is set in .env.
  # Bot gracefully falls back to in-memory cache if Redis is not available.
  redis:
    image: redis:7-alpine
    container_name: finances-redis
    restart: unless-stopped
    networks:
      - finances_net
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 50M
    command: >
      redis-server --save 60 1 --loglevel warning --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Telegram Bot ──────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: finances-bot
    restart: unless-stopped
    networks:
      - finances_net
    env_file:
      - .env
    environment:
      # Use provided env variables from .env
      MONGO_URI: "${MONGO_URI}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 400M
    volumes:
      - ./logs/bot:/app/logs
      - ./config:/app/config
      - ./backups:/app/backups
    healthcheck:
      test: [ "CMD", "python", "-c", "import app; print('ok')" ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
